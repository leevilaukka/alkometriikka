name: Test

on:
  pull_request:
  push:
    branches-ignore: ['main'] # main is tested by the build workflow before deploying

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Run tests
        run: bunx svelte-kit sync && bun test

      - name: Type check
        run: bun run check
