name: Update vintage ratings

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *' # Monthly - Alko re-publishes these PDFs infrequently

jobs:
  generate-vintages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate vintages.json
        run: bun run vintages:generate

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/vintages.json
          git commit -m "Update vintage ratings [skip ci]" || echo "No changes to commit"
          git push
