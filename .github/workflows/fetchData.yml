name: Download Price List

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_run: # Runs after page is built
    workflows: ['Build and move files to gh-pages branch']
    types:
      - completed

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Seed existing dataset from gh-pages
        run: |
          git fetch origin gh-pages || true
          if git show origin/gh-pages:data.json > /tmp/data.json 2>/dev/null; then
            mv /tmp/data.json data.json
          fi

      - name: Rehash seeded dataset to current schema
        run: |
          if [ -f data.json ]; then
            bun run scripts/setup/rehash.ts
          else
            echo "ℹ️  No seeded data.json found (first run or missing gh-pages dataset); skipping rehash."
          fi

      - name: Run script to convert to JSON
        env:
          CLOUDFLARE_PURGE_KEY: ${{ secrets.CLOUDFLARE_PURGE_KEY }}
          CLOUDFLARE_ZONE: ${{ secrets.CF_ZONE }}
          ALKO_DETAIL_CONCURRENCY: '8'
          ALKO_SEARCH_CONCURRENCY: '3'
        run: |
          for attempt in 1 2 3; do
            echo "▶️  Sync attempt $attempt..."
            if bun run scripts/setup/index.ts; then
              echo "✅ Sync succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️  Sync failed on attempt $attempt (incomplete fetch or error)"
            if [ "$attempt" -lt 3 ]; then
              echo "⏳ Waiting 60s before retrying..."
              sleep 60
            fi
          done
          echo "❌ All sync attempts failed — leaving existing dataset untouched."
          exit 1

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: data.json

      - name: Upload availability data
        uses: actions/upload-artifact@v4
        with:
          name: availability
          path: availability.json

  og-images:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: data
          path: ./
          merge-multiple: true

      - name: Check out deployed site
        run: |
          git fetch origin gh-pages
          git worktree add --detach ../gh-pages origin/gh-pages

      - name: Generate and upload OG images
        continue-on-error: true
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          CF_R2_REGION: ${{ vars.CF_R2_REGION }}
          OG_CDN_BASE: ${{ vars.OG_CDN_BASE }}
        run: |
          bun run scripts/og-images.ts --data data.json --manifest ../gh-pages/og-images.json
          cp ../gh-pages/og-images.json og-images.json

      - name: Upload updated OG image manifest
        uses: actions/upload-artifact@v4
        with:
          name: og-images
          path: og-images.json

  sitemap:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: data
          path: ./
          merge-multiple: true

      - name: Download availability data
        uses: actions/download-artifact@v4
        with:
          name: availability
          path: ./
          merge-multiple: true

      - name: Run script to generate sitemap
        run: |
          bun run scripts/sitemap.ts

      - name: Upload sitemap
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: sitemap.xml

  rss:
    needs: [sync, og-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: data
          path: ./
          merge-multiple: true

      - name: Download OG image manifest
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: og-images
          path: ./
          merge-multiple: true

      - name: Run script to generate RSS feed
        run: |
          bun run scripts/rss.ts

      - name: Upload RSS feed
        uses: actions/upload-artifact@v4
        with:
          name: rss
          path: |
            rss.xml
            feed.json
            rss

  deploy:
    needs: [sync, og-images, sitemap, rss]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all generated files
        uses: actions/download-artifact@v4
        with:
          path: ./
          merge-multiple: true

      - name: Check out deployed site
        run: |
          git fetch origin gh-pages
          git worktree add --detach ../gh-pages origin/gh-pages

      - name: Refresh product pages
        env:
          ALKO_PRERENDER_CONCURRENCY: '32'
        run: |
          cp og-images.json ../gh-pages/og-images.json
          bun run scripts/prerender-products.ts --data data.json --out ../gh-pages --template ../gh-pages/404.html --og-manifest ../gh-pages/og-images.json --manifest ../gh-pages/tuotteet-manifest.json
          cp data.json availability.json sitemap.xml rss.xml feed.json ../gh-pages/
          rm -rf ../gh-pages/rss
          cp -r rss ../gh-pages/

      - name: Commit and push downloaded file
        working-directory: ../gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json availability.json sitemap.xml rss.xml feed.json rss tuotteet tuotteet-manifest.json -f
          [ -f og-images.json ] && git add og-images.json -f || true
          git commit -m "Update price list and static product pages [skip ci]" || echo "No changes to commit"
          git push origin HEAD:gh-pages
