name: Download Price List

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Write the dataset even if the sync safeguards reject it (only for a real large selection change)'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours (also archives any missed finished days)
  workflow_run: # Runs after page is built
    workflows: ['Build and move files to gh-pages branch']
    types:
      - completed

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup

      # The sync rewrites the dataset the whole site reads: never run it with
      # lifecycle/schema code that fails its tests.
      - name: Run data and dataset tests
        run: bunx svelte-kit sync && bun test tests/data tests/alko

      - name: Seed existing dataset from gh-pages
        run: |
          git fetch origin gh-pages || true
          if git show origin/gh-pages:data.json > /tmp/data.json 2>/dev/null; then
            mv /tmp/data.json data.json
          fi
          # Change-detection hashes live next to data.json (scripts/data/dataset-file.ts).
          # If missing, they're recomputed from data.json, so this never forces a full refetch.
          if git show origin/gh-pages:hashes.json > /tmp/hashes.json 2>/dev/null; then
            mv /tmp/hashes.json hashes.json
          fi

      - name: Rehash seeded dataset to current schema
        uses: ./.github/actions/rehash-dataset

      - name: Run script to convert to JSON
        env:
          CLOUDFLARE_PURGE_KEY: ${{ secrets.CLOUDFLARE_PURGE_KEY }}
          CLOUDFLARE_ZONE: ${{ secrets.CF_ZONE }}
          ALKO_DETAIL_CONCURRENCY: '8'
          ALKO_SEARCH_CONCURRENCY: '3'
          ALKO_SYNC_FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          for attempt in 1 2 3; do
            echo "▶️  Sync attempt $attempt..."
            set +e
            bun run scripts/data/index.ts
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "✅ Sync succeeded on attempt $attempt"
              exit 0
            fi
            # Exit code 3 = the safeguards rejected the API's data; retrying won't change that.
            if [ "$code" -eq 3 ]; then
              echo "❌ Safeguards rejected the sync — leaving existing dataset untouched."
              echo "   If the change is real, re-run this workflow manually with 'force' checked."
              exit 1
            fi
            echo "⚠️  Sync failed on attempt $attempt (incomplete fetch or error)"
            if [ "$attempt" -lt 3 ]; then
              echo "⏳ Waiting 60s before retrying..."
              sleep 60
            fi
          done
          echo "❌ All sync attempts failed — leaving existing dataset untouched."
          exit 1

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            data.json
            hashes.json

      - name: Upload availability data
        uses: actions/upload-artifact@v4
        with:
          name: availability
          path: availability.json

  og-images:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: data
          path: ./
          merge-multiple: true

      - name: Check out deployed site
        uses: ./.github/actions/checkout-gh-pages

      - name: Generate and upload OG images
        continue-on-error: true
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          CF_R2_REGION: ${{ vars.CF_R2_REGION }}
          OG_CDN_BASE: ${{ vars.OG_CDN_BASE }}
        run: |
          bun run scripts/og/og-images.ts --data data.json --manifest ../gh-pages/og-images.json
          cp ../gh-pages/og-images.json og-images.json

      # Category page cards: own script, `categories/` key prefix and manifest, so
      # they can never re-key or prune the product images above
      - name: Generate and upload category OG images
        continue-on-error: true
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
          CF_R2_REGION: ${{ vars.CF_R2_REGION }}
          OG_CDN_BASE: ${{ vars.OG_CDN_BASE }}
        run: |
          bun run scripts/og/og-categories.ts --data data.json --manifest ../gh-pages/og-categories.json
          cp ../gh-pages/og-categories.json og-categories.json

      - name: Upload updated OG image manifest
        uses: actions/upload-artifact@v4
        with:
          name: og-images
          path: |
            og-images.json
            og-categories.json

  sitemap:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: data
          path: ./
          merge-multiple: true

      - name: Download availability data
        uses: actions/download-artifact@v4
        with:
          name: availability
          path: ./
          merge-multiple: true

      - name: Run script to generate sitemap
        run: |
          bun run scripts/site/sitemap.ts

      - name: Upload sitemap
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: sitemap.xml

  rss:
    needs: [sync, og-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: data
          path: ./
          merge-multiple: true

      - name: Download OG image manifest
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: og-images
          path: ./
          merge-multiple: true

      - name: Run script to generate RSS feed
        run: |
          bun run scripts/site/rss.ts

      - name: Upload RSS feed
        uses: actions/upload-artifact@v4
        with:
          name: rss
          path: |
            rss.xml
            feed.json
            rss

  deploy:
    needs: [sync, og-images, sitemap, rss]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Download all generated files
        uses: actions/download-artifact@v4
        with:
          path: ./
          merge-multiple: true

      - name: Check out deployed site
        uses: ./.github/actions/checkout-gh-pages

      - name: Run daily game tests
        uses: ./.github/actions/run-daily-tests

      # The daily manifests are immutable pins: once baked, a date must never
      # change. Seed the deployed manifests into the workspace before baking so
      # the baker skips dates that already exist instead of re-rolling them with
      # a fresh random seed (which would give players a different game mid-day).
      - name: Seed deployed daily games
        run: |
          set -e
          if [ -d ../gh-pages/daily ] && [ -n "$(ls -A ../gh-pages/daily)" ]; then
            rm -rf daily
            cp -r ../gh-pages/daily daily
            echo "✅ Seeded $(ls daily | wc -l) daily files from gh-pages"
          else
            echo "❌ daily/ missing on gh-pages — refusing to bake so no in-flight game is re-rolled."
            exit 1
          fi

      - name: Bake daily manifests
        run: |
          # Bake the daily manifests here so `daily/` exists next to the copied
          # data.json — the sync-job artifact round-trip would flatten the
          # directory into the workspace root. Existing dates are kept as-is.
          bun run daily

      # A 6-hourly fallback for the midnight-precise run in archiveDaily.yml
      # (which already publishes this the moment the day flips) — this just
      # re-confirms the same content later. Best-effort: decorative, must
      # never block the rest of the (critical) deploy job.
      - name: Generate and publish today's Daily OG card
        continue-on-error: true
        uses: ./.github/actions/daily-og
        with:
          template: ../gh-pages/404.html
          out-dir: ./daily
          r2-access-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          r2-account-id: ${{ secrets.CF_R2_ACCOUNT_ID }}
          r2-bucket: ${{ vars.CF_R2_BUCKET }}
          r2-region: ${{ vars.CF_R2_REGION }}
          og-cdn-base: ${{ vars.OG_CDN_BASE }}

      - name: Refresh product pages
        env:
          ALKO_PRERENDER_CONCURRENCY: '32'
        run: |
          cp og-images.json ../gh-pages/og-images.json
          [ -f og-categories.json ] && cp og-categories.json ../gh-pages/og-categories.json || true
          bun run scripts/site/prerender-products.ts --data data.json --out ../gh-pages --template ../gh-pages/404.html --og-manifest ../gh-pages/og-images.json --manifest ../gh-pages/tuotteet-manifest.json
          cp data.json hashes.json availability.json sitemap.xml rss.xml feed.json ../gh-pages/
          bun run scripts/site/prerender-static.ts --out ../gh-pages --template ../gh-pages/404.html --availability availability.json
          # Reset first so stale manifests (and the nested archive/) actually
          # disappear from the site instead of merging over.
          rm -rf ../gh-pages/daily
          cp -r daily ../gh-pages/
          rm -rf ../gh-pages/rss
          cp -r rss ../gh-pages/

      - name: Configure git bot identity
        uses: ./.github/actions/git-bot-identity

      - name: Commit and push downloaded file
        working-directory: ../gh-pages
        run: |
          git add data.json hashes.json availability.json sitemap.xml rss.xml feed.json rss daily tuotteet tuotteet-manifest.json kategoriat -f myymalat laskin tilastot kompassi hinnanmuutokset
          [ -f og-images.json ] && git add og-images.json -f || true
          [ -f og-categories.json ] && git add og-categories.json -f || true
          git commit -m "Update price list and static product pages [skip ci]" || echo "No changes to commit"
          git push origin HEAD:gh-pages
