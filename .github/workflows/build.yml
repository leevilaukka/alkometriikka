name: Build and move files to gh-pages branch

on:
  push:
    branches: ['main']

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup

      # Includes the pinned-manifest guard: a generator change without a
      # DAILY_GAME_VERSION bump must never deploy (live manifests would stop
      # verifying and players would get an error instead of the daily game).
      - name: Run tests
        run: bunx svelte-kit sync && bun test

      - name: Seed latest deployed dataset
        run: |
          git fetch origin gh-pages || true
          if git show origin/gh-pages:data.json > /tmp/data.json 2>/dev/null; then
            mv /tmp/data.json static/data.json
          fi
          if git show origin/gh-pages:data-removed.json > /tmp/data-removed.json 2>/dev/null; then
            mv /tmp/data-removed.json static/data-removed.json
          fi
          if git show origin/gh-pages:availability.json > /tmp/availability.json 2>/dev/null; then
            mv /tmp/availability.json static/availability.json
          fi
          if git show origin/gh-pages:og-images.json > /tmp/og-images.json 2>/dev/null; then
            mv /tmp/og-images.json static/og-images.json
          fi
          if git show origin/gh-pages:og-categories.json > /tmp/og-categories.json 2>/dev/null; then
            mv /tmp/og-categories.json static/og-categories.json
          fi

      - name: Build site assets
        env:
          BASE_PATH: ''
        run: |
          bun run vite build
          # Each route's chunk list, deployed for stubs re-rendered later by fetchData.yml
          bun run scripts/site/route-preloads.ts --out build
          # static/ is copied as-is, so minify the vendored analytics script in the output
          bun build static/scripts/simpleanalytics/auto-events.js --minify \
            --outfile build/scripts/simpleanalytics/auto-events.js

      - name: Check if product pages need regenerating
        id: prerender-gate
        run: |
          set -e
          changed=false
          for f in data.json data-removed.json 404.html og-images.json; do
            if git show "origin/gh-pages:$f" 2>/dev/null | cmp -s - "build/$f"; then
              echo "· $f unchanged"
            else
              echo "· $f differs — product pages will be regenerated"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Product pages embed the built page shell (hashed asset URLs), so they
      # must be present in the deploy even when nothing changed. Restore the
      # last deployed pages first so the incremental prerender below can skip
      # untouched products and so a skip keeps the existing pages on gh-pages.
      - name: Restore last deployed product and category pages
        run: |
          # Restore each path separately: git archive fails as a whole when any
          # one pathspec is missing (e.g. the manifest on the first run after
          # adding it), which would otherwise silently drop the pages too.
          git archive origin/gh-pages tuotteet 2>/dev/null | tar -x -C build/ || true
          git archive origin/gh-pages tuotteet-manifest.json 2>/dev/null | tar -x -C build/ || true
          git archive origin/gh-pages kategoriat 2>/dev/null | tar -x -C build/ || true

      # The daily manifests are immutable pins: once baked, a date must never
      # change. Restoring them here (inside build/, same as tuotteet) — instead
      # of later into the repo root — keeps them through the `rm -rf !(build)`
      # pruning and the force-push, so a stale/broken restore can never wipe
      # them and let a later bake re-seed an in-flight game. Keep the restored
      # copy (fetchData re-bakes with the same seed because the pins exist).
      - name: Restore pre-baked daily games into build output
        run: |
          set -e
          if git archive origin/gh-pages daily 2>/dev/null | tar -x -C build/ && [ -d build/daily ] && [ -n "$(ls -A build/daily)" ]; then
            for legacy in build/daily/arkisto build/daily/arkisto-data; do
              if [ -d "$legacy" ]; then
                if [ ! -d build/daily/archive ]; then
                  mv "$legacy" build/daily/archive
                else
                  cp -rn "$legacy"/* build/daily/archive/ 2>/dev/null || true
                  rm -rf "$legacy"
                fi
              fi
            done
            echo "✅ Restored $(ls build/daily | wc -l) daily files from gh-pages"
          else
            echo "❌ daily/ was not restored — refusing to deploy so clients never see a re-baked game."
            exit 1
          fi

      - name: Prerender product and category pages
        if: steps.prerender-gate.outputs.changed == 'true'
        run: |
          bun run scripts/site/prerender-products.ts \
            --out build \
            --data build/data.json \
            --template build/404.html \
            --og-manifest build/og-images.json

      # Cheap (a few hundred files), so always regenerated: the pages embed the
      # built page shell and the store list from availability.json.
      - name: Prerender static and store pages
        run: |
          bun run scripts/site/prerender-static.ts \
            --out build \
            --template build/404.html \
            --availability build/availability.json

      - name: Delete all files except build directory
        run: |
          shopt -s extglob
          rm -rf !(build)

      - name: Move built files to root
        run: |
          mv build/* .
          rm -rf build

      # The sync's change-detection hashes (not used by the site). Without this the
      # force-push below would drop them; the sync would then recompute them.
      - name: Restore hashes.json from existing gh-pages
        run: |
          if git show origin/gh-pages:hashes.json > /tmp/hashes.json 2>/dev/null; then
            mv /tmp/hashes.json hashes.json
          fi

      - name: Restore sitemap.xml from existing gh-pages
        run: |
          if git show origin/gh-pages:sitemap.xml > /tmp/sitemap.xml 2>/dev/null; then
            mv /tmp/sitemap.xml sitemap.xml
          fi

      - name: Restore rss.xml from existing gh-pages
        run: |
          if git show origin/gh-pages:rss.xml > /tmp/rss.xml 2>/dev/null; then
            mv /tmp/rss.xml rss.xml
          fi

      - name: Restore feed.json from existing gh-pages
        run: |
          if git show origin/gh-pages:feed.json > /tmp/feed.json 2>/dev/null; then
            mv /tmp/feed.json feed.json
          fi

      - name: Restore per-product rss feeds from existing gh-pages
        run: |
          if git cat-file -e origin/gh-pages:rss 2>/dev/null; then
            git archive origin/gh-pages rss | tar -x
          fi

      # Built up run by run (scripts/data/stock-history.ts); dropping it would restart the history.
      # Fails the build if the restore breaks, rather than force-pushing gh-pages without it.
      - name: Restore stock history from existing gh-pages
        run: |
          if git cat-file -e origin/gh-pages:stock 2>/dev/null; then
            git archive origin/gh-pages stock | tar -x
          fi

      - name: Create CNAME and .nojekyll file
        run: |
          echo "alkometriikka.fi" > CNAME
          touch .nojekyll

      - name: Configure git bot identity
        uses: ./.github/actions/git-bot-identity

      - name: Push build to gh-pages branch
        run: |
          git checkout -b gh-pages
          git add .
          # Runtime datasets are gitignored, so `git add .` skips them. Force-add
          # them so the force-push to gh-pages preserves the data deployed by
          # fetchData.yml instead of deleting it on every site build.
          for f in data.json data-removed.json hashes.json availability.json sitemap.xml rss.xml feed.json rss stock og-images.json og-categories.json daily tuotteet-manifest.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          git commit -m "Deploy to GitHub Pages [skip ci]" || echo "No changes to commit"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Not deployed here: the Download Price List run that follows this one
      # (workflow_run) rebuilds the product pages on top of this push and does
      # the single Pages deploy and cache purge, so a push is never deployed twice.

  # Records the run (result, timings) in R2 for build monitoring.
  report:
    needs: [build_site]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Record run
        uses: ./.github/actions/report-run
        with:
          needs: ${{ toJSON(needs) }}
          github-token: ${{ github.token }}
          r2-access-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          r2-account-id: ${{ secrets.CF_R2_ACCOUNT_ID }}
          r2-bucket: ${{ vars.CF_R2_BUCKET }}
          r2-region: ${{ vars.CF_R2_REGION }}
