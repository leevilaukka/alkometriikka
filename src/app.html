		%sveltekit.head%
		<style>
			:root {
				--loader-color-1: rgb(229, 27, 21);
				--loader-color-2: rgb(191, 22, 22);
				--loader-color-3: rgb(150, 15, 15);
				--loader-color-4: rgb(82, 0, 10);
				font-size: 14px;
			}

			#main-loader {
				position: fixed;
				inset: 0;
				z-index: 999999;
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				grid-template-rows: 1fr auto;
				align-items: end;
				background: white;
				transition: transform 500ms ease-in-out;
				background-color: white;

				@media (prefers-color-scheme: dark) {
					background-color: var(--loader-color-4);
				}
			}

			#main-loader.shift {
				transform: translateY(-100%);
			}

			#loader-header {
				grid-column: 1/-1;
				display: grid;
				place-content: center;
				text-align: center;
				gap: 0.5rem;
				height: 100%;
				font-family: sans-serif;
			}

			#loader-header img {
				display: block;
				height: 4.5rem;
				aspect-ratio: 263.28/69.19;
			}

			#main-loader .loader-bar {
				display: block;
				animation: oscillate 2s infinite linear;
			}

			#main-loader .loader-center {
				display: flex;
				flex-direction: column;
				justify-content: end;
				height: 33.333vh;
				aspect-ratio: 341.34/927.22;
				fill: var(--loader-color-2);
			}

			#main-loader .loader-left {
				display: flex;
				flex-direction: row-reverse;
				justify-content: end;
				align-items: end;
				height: 55%;
				flex-shrink: 0;
				overflow: hidden;

				& .loader-bar {
					background: var(--loader-color-1);
				}

				& .loader-bar:nth-child(2n) {
					background: var(--loader-color-2);
				}

				& .loader-bar:nth-child(3n) {
					background: var(--loader-color-3);
				}
			}

			#main-loader .loader-right {
				display: flex;
				flex-direction: row;
				justify-content: start;
				align-items: end;
				height: 55%;
				flex-shrink: 0;
				overflow: hidden;

				& .loader-bar {
					background: var(--loader-color-3);
				}

				& .loader-bar:nth-child(2n) {
					background: var(--loader-color-2);
				}

				& .loader-bar:nth-child(3n) {
					background: var(--loader-color-1);
				}
			}

			@keyframes oscillate {
				0% {
					height: 20%;
				}

				50% {
					height: 100%;
				}

				100% {
					height: 20%;
				}
			}
		</style>

		<!-- Simple Analytics - simpleanalytics.com -->
		<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
		<script async src="/scripts/simpleanalytics/auto-events.js"></script>

		<!-- Cloudflare Web Analytics -->
		<script
			defer
			src="https://static.cloudflareinsights.com/beacon.min.js"

		<!-- End Cloudflare Web Analytics -->
		<!-- Umami Analytics -->
		<script
			defer
			src="https://analytics.alkometriikka.fi/script.js"
			data-website-id="57fef1b0-17a9-4613-9263-1ab5f3206957"
			data-exclude-search="true"
			data-do-not-track="true"
			data-performance="true"
		></script>
		<script
			defer
			src="https://analytics.alkometriikka.fi/recorder.js"
			data-website-id="57fef1b0-17a9-4613-9263-1ab5f3206957"
		></script>
		<!-- End Umami Analytics -->
	</head>

	<body data-sveltekit-preload-data="hover">
		<noscript>
			<dialog open>
				Alkometriikka vaatii JavaScriptin toimiakseen! Ota JavaScript käyttöön selaimen asetuksista,
				tai poista sen käyttöä rajoittavat estot.
			</dialog>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
		<div open id="main-loader">
			<div id="loader-header">
				<img
					id="loading-graphic"
					src="%sveltekit.assets%/images/loader-logo.svg"
					alt="Alkometriikka"
				/>
			</div>
			<div class="loader-left"></div>
			<div class="loader-center">
				<svg
					id="loader-bottle"
					data-name="loader-bottle"
					xmlns="http://www.w3.org/2000/svg"
					viewBox="0 0 341.34 927.22"
				>
					<path
						d="M341.34,376.9v550.32H0V376.9c0-60.39,31.37-113.45,78.7-143.79,15.25-9.77,24.63-26.48,24.63-44.58V0h134.68v188.53c0,18.11,9.39,34.81,24.63,44.58,47.33,30.34,78.7,83.4,78.7,143.79Z"
					/>
				</svg>
			</div>
			<div class="loader-right"></div>
		</div>
		<script>
			const loaderElement = document.getElementById('main-loader');
			const loaderBottle = document.getElementById('loader-bottle');
			const loaderCenter = loaderElement.querySelector('.loader-center');
			const loaderLeft = loaderElement.querySelector('.loader-left');
			const loaderRight = loaderElement.querySelector('.loader-right');

			function getBarsCount(side) {
				const width = side.clientWidth;
				return Math.ceil(width / loaderCenter.clientWidth);
			}

			function fillLoaderBars(side) {
				[...side.children].forEach((child) => {
					child.remove();
				});
				const count = getBarsCount(side);
				for (let i = 0; i < count; i++) {
					const element = document.createElement('div');
					element.classList.add('loader-bar');
					element.style.minWidth = `${loaderCenter.clientWidth}px`;
					side.appendChild(element);
					const animation = element.getAnimations()[0];
					const duration = animation.effect.getTiming().duration;
					animation.currentTime = (duration / 2) * Math.random();
				}
			}

			function setupLoader() {
				loaderLeft.style.height = `${loaderBottle.clientHeight * 0.55}px`;
				loaderRight.style.height = `${loaderBottle.clientHeight * 0.55}px`;
				fillLoaderBars(loaderLeft);
				fillLoaderBars(loaderRight);
			}

			setupLoader();

			window.addEventListener('resize', () => {
				setupLoader();
			});
		</script>
	</body>
